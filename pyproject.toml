[project]
name = "claude-buddy-picker"
version = "1.0.0"
description = "Re-roll your Claude Code /buddy companion pet"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Levi", email = "126132428+AluminumShark@users.noreply.github.com" },
]
keywords = ["claude", "buddy", "cli", "companion", "pet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "numba>=0.65.0",
]

[project.scripts]
buddy-picker = "buddy_picker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buddy_picker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.8",
    "ty>=0.0.27",
]
